name: Build unsigned LiveContainer IPA

on:
  workflow_dispatch:
  push:
    branches: [ "codex/**" ]
    paths:
      - ".github/workflows/build-unsigned-ipa.yml"
      - ".github/scripts/*generation-limits*"
      - ".github/scripts/*sampling*"
      - ".github/scripts/*thinking*"
      - ".github/scripts/package-unsigned-ipa.sh"
      - "FlashMoE-iOS/**"
      - "metal_infer/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-unsigned-ipa.yml"
      - ".github/scripts/package-unsigned-ipa.sh"
      - ".github/scripts/*generation-limits*"
      - ".github/scripts/*sampling*"
      - ".github/scripts/*thinking*"
      - "FlashMoE-iOS/**"
      - "metal_infer/**"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build and validate unsigned IPA
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test sampling controls
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            .github/scripts/test-sampling.c \
            -o "$RUNNER_TEMP/test-sampling"
          "$RUNNER_TEMP/test-sampling"

      - name: Test generation context limits
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            .github/scripts/test-generation-limits.c \
            -o "$RUNNER_TEMP/test-generation-limits"
          "$RUNNER_TEMP/test-generation-limits"

      - name: Test thinking controls
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            .github/scripts/test-thinking.c \
            -o "$RUNNER_TEMP/test-thinking"
          "$RUNNER_TEMP/test-thinking"

      - name: Test workflow and IPA packaging helpers
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-tests"
          "$RUNNER_TEMP/workflow-tests/bin/python" -m pip install PyYAML
          "$RUNNER_TEMP/workflow-tests/bin/python" .github/scripts/test-workflows.py
          bash .github/scripts/test-package-unsigned-ipa.sh

      - name: Build unsigned device app
        run: |
          xcodebuild clean build analyze \
            -project FlashMoE-iOS/FlashMoE.xcodeproj \
            -scheme FlashMoE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FlashMoEDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package and validate LiveContainer IPA
        run: |
          APP="$RUNNER_TEMP/FlashMoEDerivedData/Build/Products/Release-iphoneos/FlashMoE.app"
          bash .github/scripts/package-unsigned-ipa.sh \
            "$APP" \
            artifacts/FlashMoE-unsigned.ipa

          {
            echo '### LiveContainer IPA'
            echo 'Download the **FlashMoE-unsigned-ipa** artifact, unzip the GitHub artifact once, then import `FlashMoE-unsigned.ipa` into LiveContainer.'
            echo 'The IPA is unsigned; LiveContainer must sign it or bypass code signing according to its configuration.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: FlashMoE-unsigned-ipa
          path: artifacts/FlashMoE-unsigned.ipa
          if-no-files-found: error

  simulator-tests:
    name: Test generation settings in iOS Simulator
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)["devices"]
          iphones = [device for runtime, group in devices.items()
                     if "iOS-26" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iOS 26 iPhone simulator")
          print("udid=" + iphones[0]["udid"])
          PY

      - name: Run settings unit tests and UI tests
        run: |
          mkdir -p artifacts
          xcodebuild test \
            -project FlashMoE-iOS/FlashMoE.xcodeproj \
            -scheme FlashMoE \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/FlashMoESimulator" \
            -resultBundlePath artifacts/SimulatorTests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sampling-simulator-tests
          path: artifacts/SimulatorTests.xcresult
          if-no-files-found: warn
